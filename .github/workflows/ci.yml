# CI untuk HC Core.
#
# CLAUDE.md: `npm run lint` dan `npm run typecheck` wajib hijau sebelum commit,
# dan `npm test` memuat penjaga yang memang ditulis untuk ditegakkan mesin —
# tests/serverOnlyBoundary (service role bocor ke client), tests/migrationInvariants
# (file migration ketiga, shim lokal bocor ke produksi), tests/batchDiscipline,
# scripts/check-select-columns. Tanpa workflow ini semuanya bergantung pada
# orang yang ingat menjalankannya.
#
# Tidak ada dependency baru (ADR-005 §1): semua perintah di bawah ada di
# package.json. Tidak ada rahasia: `next build` memakai env placeholder karena
# setiap halaman `force-dynamic` dan build tidak menyentuh database (ADR-005 §6).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cek:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build

  skema:
    # Skema diverifikasi terhadap PostgreSQL 16 biasa, bukan Supabase (ADR-005 §8):
    # scripts/db-local.sh memasang db/local/00-shim.sql + kedua migration apa
    # adanya, lalu menjalankan scripts/verify-schema.sql (RLS per role, trigger
    # revisi, batch, InitPlan policy). Runner ubuntu-latest sudah membawa
    # PostgreSQL 16 dalam keadaan berhenti; skrip memakai `sudo -u postgres`.
    name: skema · PostgreSQL 16 lokal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL yang sudah terpasang di runner
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 20); do pg_isready -q && break; sleep 1; done
          pg_isready

      # db-local.sh menjalankan `sudo -u postgres psql -f <file di repo>`, jadi
      # OS user `postgres` harus bisa MEMBACA file SQL di workspace. Di runner,
      # /home/runner bermode 750, dan tanpa ini psql berhenti di
      # "00-shim.sql: Permission denied" (run pertama workflow ini). Diberi
      # izin lintas (o+x) ke setiap direktori induk dan baca (o+rX) ke workspace.
      - name: Izinkan OS user postgres membaca file SQL di workspace
        run: |
          d="$GITHUB_WORKSPACE"
          while [ "$d" != "/" ]; do sudo chmod o+x "$d"; d="$(dirname "$d")"; done
          sudo chmod -R o+rX "$GITHUB_WORKSPACE"

      - run: npm run db:local

      # JALUR NAIK — migration ini dipasang di atas skema yang SUDAH ADA.
      #
      # `db:local` di atas menghapus databasenya lebih dulu, jadi ia hanya
      # pernah menguji pemasangan ke database KOSONG. Padahal satu-satunya
      # pihak yang benar-benar memasang migration ini adalah orang yang
      # menempelkannya ke SQL Editor Supabase — selalu ke database berisi.
      # Selisih itu pernah lolos sekali: `create or replace view` hanya boleh
      # MENAMBAH kolom di ujung, jadi kolom yang disisipkan di tengah view
      # ditolak 42P16 di Supabase sementara CI tetap hijau.
      #
      # Caranya: pasang migration versi `main` dulu, lalu jalankan
      # `db-local.sh --keep` (pakai database yang sama, tanpa menghapusnya)
      # supaya migration versi PR ini dipasang DI ATASNYA, lalu diverifikasi.
      # Pada push ke main keduanya sama, dan langkah ini berubah menjadi uji
      # idempotensi — memasang migration yang sama dua kali harus tetap hijau.
      - name: Jalur naik — skema main dulu, migration PR ini di atasnya
        run: |
          git fetch --no-tags --depth=1 origin main
          base="$RUNNER_TEMP/migrasi-main"
          mkdir -p "$base"
          for f in supabase/migrations/*.sql; do
            git show "origin/main:$f" > "$base/$(basename "$f")"
          done
          chmod -R a+rX "$RUNNER_TEMP"

          psu() { sudo -u postgres psql -v ON_ERROR_STOP=1 -X -q "$@"; }
          psu -d postgres -c 'drop database if exists hc_core_naik with (force);'
          psu -d postgres -c 'create database hc_core_naik;'
          psu -d hc_core_naik -f db/local/00-shim.sql
          for f in "$base"/*.sql; do psu -d hc_core_naik -f "$f"; done

          HC_LOCAL_DB=hc_core_naik bash scripts/db-local.sh --keep

      # Tiga test ber-database: lib/derived/sql.test.ts (lib/derived vs
      # v_employees), tests/seedFromPayload.sql.test.ts (workbook dummy →
      # seed_from_payload → satu Batch seed), dan
      # tests/importFromPayload.sql.test.ts (impor berulang: kunci
      # personnel_number, sel kosong tidak mengosongkan, baris yang tidak
      # berubah tidak disentuh). Di `npm test` biasa ketiganya melewati diri
      # sendiri kalau tidak ada Postgres (job `cek` di atas). Di
      # sini databasenya ada, dan db-local.sh sudah membuat role superuser
      # untuk OS user pemanggil (`runner`), jadi test masuk lewat socket
      # peer-auth tanpa konfigurasi. `grep` memastikan ketiganya benar-benar
      # jalan, bukan dilewati.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test ber-database (kolom turunan, seed_from_payload, import_from_payload)
        # NO_COLOR: di runner, CI=true membuat vitest tetap mencetak kode warna
        # ANSI meski di-pipe, dan run kedua workflow ini gagal hanya karena grep
        # tidak menemukan "Tests  2 passed" di sela kode warna — testnya sendiri
        # lulus. Warna dimatikan dan polanya dilonggarkan; "Test Files 1 passed"
        # tidak ikut cocok.
        env:
          NO_COLOR: "1"
        run: |
          npx vitest run lib/derived/sql.test.ts tests/seedFromPayload.sql.test.ts tests/importFromPayload.sql.test.ts 2>&1 | tee sql-test.log
          grep -qE "Test Files.*3 passed.*\(3\)" sql-test.log
          # Jumlahnya DIPATOK, bukan sekadar "tidak ada yang gagal": ketiga
          # berkas memakai `describe.skipIf(client === null)`, jadi tanpa
          # database yang bisa dihubungi mereka MELEWATI diri sendiri dan
          # vitest tetap melaporkan "3 passed". Angka inilah yang membedakan
          # "14 test berjalan" dari "14 test dilewati diam-diam".
          #
          # Menambah test ber-database berarti menaikkan angka ini. Kalau job
          # ini merah padahal daftar test di atasnya hijau semua, itu yang
          # terjadi — cocokkan angkanya, jangan longgarkan polanya.
          grep -qE "Tests.*14 passed.*\(14\)" sql-test.log
